name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run unit and metamorphic tests
        run: npm test
      - name: Verify protocol examples and certificates
        run: npm run demo
      - name: Exercise deterministic benchmark harness
        run: npm run benchmark
